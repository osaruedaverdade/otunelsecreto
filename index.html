<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Túnel USP 3D (Reitoria → CRUSP)</title>

  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- CSS Local -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE ENTRADA -->
  <div id="startScreen">
    <h1>Túnel USP 3D</h1>
    <div class="door-frame">
      <div class="door-knob"></div>
    </div>
    <button class="enter-btn" id="startBtn">ENTRAR NO TÚNEL</button>
  </div>

  <!-- TELA DE CARREGAMENTO -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Carregando áudios e gerando o túnel...</p>
  </div>

  <!-- CONTAINER DO JOGO 3D -->
  <div id="webgl-container"></div>

  <!-- INTERFACE DO USUÁRIO -->
  <div id="gameUI">
    <div class="hud">
      <span>Passos: <strong id="stepCount">0</strong></span>
      <span>Tempo: <strong id="timer">0s</strong></span>
      
      <div class="hud-buttons">
        <button id="muteBtn" class="hud-btn" title="Ligar/Desligar Som">🔊</button>
        <button id="homeBtn" class="hud-btn" title="Voltar ao Início">🏠</button>
      </div>
    </div>

    <!-- CONTROLES VIRTUAIS -->
    <div class="controls">
      <button class="btn-ctrl btn-up" id="btnUp">▲</button>
      <button class="btn-ctrl btn-left" id="btnLeft">◄</button>
      <button class="btn-ctrl btn-down" id="btnDown">▼</button>
      <button class="btn-ctrl btn-right" id="btnRight">►</button>
    </div>
  </div>

  <!-- MODAL DE VITÓRIA -->
  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2>🎉 Você Chegou ao CRUSP!</h2>
      <p id="winStats"></p>
      <button onclick="resetGame()">Jogar Novamente</button>
    </div>
  </div>

  <!-- Lógica do Jogo -->
  <script src="game.js"></script>
</body>
</html>
